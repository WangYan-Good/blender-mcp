[project]
name = "blender-mcp"
version = "2.0.0"
description = "Local Blender 5 core iteration loop through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "BlenderMCP contributors"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.28.1,<2",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[project.urls]
"Homepage" = "https://github.com/WangYan-Good/blender-mcp"
"Bug Tracker" = "https://github.com/WangYan-Good/blender-mcp/issues"
